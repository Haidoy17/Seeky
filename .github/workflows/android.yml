name: Android

on:
  push:
    branches: [main, 'claude/**']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Compilar APK de depuração (Gradle)
        run: ./gradlew --no-daemon assembleDebug
      - name: Testes do núcleo (JVM)
        run: python3 tools/run_tests.py
      - uses: actions/upload-artifact@v4
        with:
          name: seeky-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

  # APK final assinado com a chave do Seeky (a mesma do módulo Seeky Vozes Naturais),
  # para actualizar a instalação existente sem perder dados. Só corre quando os segredos
  # SEEKY_KEYSTORE_BASE64, SEEKY_SIGN_ALIAS e SEEKY_SIGN_PASSWORD existem no repositório.
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'push'
    env:
      HAS_KEY: ${{ secrets.SEEKY_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Sem chave configurada
        if: env.HAS_KEY != 'true'
        run: echo "::notice::Defina os segredos SEEKY_KEYSTORE_BASE64, SEEKY_SIGN_ALIAS e SEEKY_SIGN_PASSWORD para obter o APK assinado."
      - name: Preparar chave (fora do repositório)
        if: env.HAS_KEY == 'true'
        env:
          SEEKY_KEYSTORE_BASE64: ${{ secrets.SEEKY_KEYSTORE_BASE64 }}
        run: |
          echo "$SEEKY_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/seeky-release.keystore"
          echo "SEEKY_SIGN_FILE=$RUNNER_TEMP/seeky-release.keystore" >> "$GITHUB_ENV"
      - name: Compilar APK assinado
        if: env.HAS_KEY == 'true'
        env:
          SEEKY_SIGN_ALIAS: ${{ secrets.SEEKY_SIGN_ALIAS }}
          SEEKY_SIGN_PASSWORD: ${{ secrets.SEEKY_SIGN_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease
      - name: Verificar assinatura
        if: env.HAS_KEY == 'true'
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk | grep -E "SHA-256 digest|DN"
          rm -f "$RUNNER_TEMP/seeky-release.keystore"
      - uses: actions/upload-artifact@v4
        if: env.HAS_KEY == 'true'
        with:
          name: seeky-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 7
