name: Android

on:
  push:
    branches: [main, 'claude/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Compilar APK de depuração (Gradle)
        run: ./gradlew --no-daemon assembleDebug
      - name: Testes do núcleo (JVM)
        run: python3 tools/run_tests.py
      - uses: actions/upload-artifact@v4
        with:
          name: seeky-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

  # Versão comercial: APK assinado com a chave do Seeky (a mesma do módulo Seeky Vozes
  # Naturais), que actualiza a instalação existente sem perder dados. Requer os segredos
  # SEEKY_KEYSTORE_BASE64, SEEKY_SIGN_ALIAS e SEEKY_SIGN_PASSWORD. Numa etiqueta v* publica
  # também um GitHub Release com o APK.
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name != 'pull_request'
    permissions:
      contents: write
    env:
      HAS_KEY: ${{ secrets.SEEKY_KEYSTORE_BASE64 != '' }}
      IS_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Sem chave configurada
        if: env.HAS_KEY != 'true'
        run: |
          echo "::warning::Defina os segredos SEEKY_KEYSTORE_BASE64, SEEKY_SIGN_ALIAS e SEEKY_SIGN_PASSWORD para obter a versão comercial assinada."
          if [ "$IS_TAG" = "true" ]; then echo "::error::Uma versão comercial não pode ser publicada sem a chave."; exit 1; fi
      - name: Preparar chave (fora do repositório)
        if: env.HAS_KEY == 'true'
        env:
          SEEKY_KEYSTORE_BASE64: ${{ secrets.SEEKY_KEYSTORE_BASE64 }}
        run: |
          echo "$SEEKY_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/seeky-release.keystore"
          echo "SEEKY_SIGN_FILE=$RUNNER_TEMP/seeky-release.keystore" >> "$GITHUB_ENV"
      - name: Compilar versão comercial assinada
        if: env.HAS_KEY == 'true'
        env:
          SEEKY_SIGN_ALIAS: ${{ secrets.SEEKY_SIGN_ALIAS }}
          SEEKY_SIGN_PASSWORD: ${{ secrets.SEEKY_SIGN_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease
      - name: Verificar assinatura e nomear APK
        if: env.HAS_KEY == 'true'
        run: |
          rm -f "$RUNNER_TEMP/seeky-release.keystore"
          APK=app/build/outputs/apk/release/app-release.apk
          test -f "$APK" || { echo "::error::O APK não foi assinado. Confirme o alias e a palavra-passe."; exit 1; }
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs "$APK" | grep -E "certificate DN|certificate SHA-256"
          VERSION=$(sed -n "s/^ *versionName '\(.*\)'/\1/p" app/build.gradle)
          mkdir -p dist && cp "$APK" "dist/Seeky_${VERSION}.apk"
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
          echo "SEEKY_VERSION=$VERSION" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        if: env.HAS_KEY == 'true'
        with:
          name: seeky-release-apk
          path: dist/
          retention-days: 30
      - name: Publicar GitHub Release
        if: env.HAS_KEY == 'true' && env.IS_TAG == 'true'
        uses: softprops/action-gh-release@v2
        with:
          name: Seeky ${{ env.SEEKY_VERSION }}
          body_path: docs/RELEASE_NOTES.md
          files: |
            dist/Seeky_${{ env.SEEKY_VERSION }}.apk
            dist/SHA256SUMS.txt
