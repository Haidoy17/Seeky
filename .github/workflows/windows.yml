name: Windows

# Seeky para Windows: compila e testa no Linux (como no computador de desenvolvimento) e, numa máquina
# Windows verdadeira, instala o instalador publicado em entrega/windows e corre "Seeky.exe --self-test".
on:
  push:
    branches: [main, 'claude/**']
    paths: ['desktop/**', 'tools/build_desktop.py', 'entrega/windows/**', 'app/src/main/java/**', '.github/workflows/windows.yml']
  pull_request:
    paths: ['desktop/**', 'tools/build_desktop.py', 'entrega/windows/**', 'app/src/main/java/**', '.github/workflows/windows.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compilar o Seeky Desktop e correr o autoteste
        run: python3 tools/build_desktop.py --cache "$RUNNER_TEMP/desktop-cache"

  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Instalar sem perguntas (como um utilizador)
        shell: pwsh
        run: |
          $setup = Get-ChildItem entrega/windows/Seeky-Setup-*-x64.exe | Sort-Object LastWriteTime | Select-Object -Last 1
          Write-Host "Instalador: $($setup.Name) ($([math]::Round($setup.Length/1MB,1)) MB)"
          $p = Start-Process $setup.FullName -ArgumentList '/S' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "O instalador terminou com $($p.ExitCode)" }
          $dir = "$env:LOCALAPPDATA\Programs\Seeky"
          foreach ($f in 'Seeky.exe','runtime\bin\javaw.exe','app\seeky-desktop.jar','Desinstalar.exe') { if (!(Test-Path "$dir\$f")) { throw "Falta $f" } }
          if (!(Test-Path "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\Seeky\Seeky.lnk")) { throw "Falta o atalho no menu Iniciar" }
      - name: Actualizar como o Seeky faz (pacote de entrega/windows)
        shell: pwsh
        run: |
          # O mesmo que Definições → Procurar actualizações: verifica o SHA-256, instala em
          # %LOCALAPPDATA%\Seeky\app\<versão> e escreve current.txt; o Seeky.exe passa a usá-la.
          $manifest = Get-Content entrega/windows/latest.json -Raw | ConvertFrom-Json
          $zip = Get-Item "entrega/windows/Seeky-Desktop-$($manifest.versionName)-app.zip"
          $hash = (Get-FileHash $zip.FullName -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne $manifest.sha256) { throw "SHA-256 do pacote não corresponde a latest.json" }
          $apps = "$env:LOCALAPPDATA\Seeky\app"
          New-Item -ItemType Directory -Force "$apps\$($manifest.versionName)" | Out-Null
          Expand-Archive $zip.FullName -DestinationPath "$apps\$($manifest.versionName)" -Force
          [IO.File]::WriteAllText("$apps\current.txt", $manifest.versionName)
          $out = & "$env:LOCALAPPDATA\Programs\Seeky\runtime\bin\java.exe" '-Dfile.encoding=UTF-8' '--add-modules' 'javafx.controls,javafx.web,javafx.media,javafx.swing' '-cp' "$apps\$($manifest.versionName)\*" 'mz.bam.seeky.android.DeskLauncher' '--self-test'
          $out | Write-Host
          if ($LASTEXITCODE -ne 0) { throw "Autoteste da versão actualizada falhou" }
          if (-not ($out -match "^PASS vers\S+ $([regex]::Escape($manifest.versionName))$")) { throw "A versão actualizada não é $($manifest.versionName)" }
          Write-Host "Actualizado para $($manifest.versionName)"
      - name: Autoteste pelo Seeky.exe
        shell: pwsh
        run: |
          $dir = "$env:LOCALAPPDATA\Programs\Seeky"
          & "$dir\runtime\bin\java.exe" '-Dfile.encoding=UTF-8' '--add-modules' 'javafx.controls,javafx.web,javafx.media,javafx.swing' '-cp' "$dir\app\*" 'mz.bam.seeky.android.DeskLauncher' '--self-test'
          if ($LASTEXITCODE -ne 0) { throw "Autoteste falhou ($LASTEXITCODE)" }
          $p = Start-Process "$dir\Seeky.exe" -ArgumentList '--self-test' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Seeky.exe --self-test terminou com $($p.ExitCode)" }
          Write-Host "Seeky.exe --self-test: OK"
      - name: Abrir as janelas no Windows e tirar capturas
        shell: pwsh
        run: |
          $out = "$env:RUNNER_TEMP\capturas"
          $p = Start-Process "$env:LOCALAPPDATA\Programs\Seeky\Seeky.exe" -ArgumentList "--screenshots=$out" -PassThru
          $deadline = (Get-Date).AddMinutes(4)
          while ((Get-Date) -lt $deadline -and (Get-ChildItem $out -Filter *.png -ErrorAction SilentlyContinue).Count -lt 10) { Start-Sleep -Seconds 3 }
          Start-Sleep -Seconds 3
          Get-Process javaw -ErrorAction SilentlyContinue | Stop-Process -Force
          $n = (Get-ChildItem $out -Filter *.png -ErrorAction SilentlyContinue).Count
          Write-Host "Capturas: $n"
          if ($n -lt 10) { throw "O Seeky não abriu todas as janelas no Windows ($n capturas)" }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: seeky-windows-capturas
          path: ${{ runner.temp }}/capturas
          retention-days: 14
      - name: Instalador publicado coincide com latest.json
        shell: pwsh
        run: |
          $manifest = Get-Content entrega/windows/latest.json -Raw | ConvertFrom-Json
          $setup = Get-Item ("entrega/windows/" + ($manifest.installer -split '/')[-1])
          $hash = (Get-FileHash $setup.FullName -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne $manifest.installerSha256) { throw "SHA-256 do instalador não corresponde a latest.json" }
      - name: Desinstalar
        shell: pwsh
        run: |
          $p = Start-Process "$env:LOCALAPPDATA\Programs\Seeky\Desinstalar.exe" -ArgumentList '/S' -Wait -PassThru
          Start-Sleep -Seconds 5
          if (Test-Path "$env:LOCALAPPDATA\Programs\Seeky\Seeky.exe") { throw "A desinstalação deixou o Seeky.exe" }
