plugins { id 'com.android.application' }
android {
 namespace 'mz.bam.seeky.android'
 compileSdk 36
 defaultConfig {
  applicationId 'mz.bam.seeky.estudos'
  minSdk 26
  targetSdk 36
  versionCode 5003700
  versionName '5.15.1'
 }
 signingConfigs {
  externalRelease {
   if (System.getenv('SEEKY_SIGN_FILE')) storeFile file(System.getenv('SEEKY_SIGN_FILE'))
   storePassword System.getenv('SEEKY_SIGN_PASSWORD')
   keyAlias System.getenv('SEEKY_SIGN_ALIAS')
   keyPassword System.getenv('SEEKY_SIGN_PASSWORD')
  }
 }
 buildTypes { release { minifyEnabled false; signingConfig signingConfigs.externalRelease } }
 compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
}

dependencies { implementation fileTree(dir: 'libs', include: ['*.jar']) }
